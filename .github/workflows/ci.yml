name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build main/preload/local pages
        run: npm run build

      # Issue #14: every relative link and image in README/README.ru/docs must resolve.
      - name: Documentation links (README, README.ru, docs)
        run: npm run docs:check

      # Renders the app-owned footer and settings popover under Xvfb and asserts
      # what they show (issue #9). No WSL and no DeepSeek Harness involved.
      - name: Chrome smoke (footer + settings popover)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          npm run chrome:smoke

      # Builds the real Windows/WebContentsView composition against a local test
      # server: bar geometry, WebUI bounds, resize and session continuity.
      - name: Composition smoke (real window + view)
        run: npm run composition:smoke

      # Reads the pixels the operating system really shows: geometry and DOM can
      # both be right while the remote surface stays invisible (issue #11).
      - name: Composition paint probe (real screen pixels)
        run: npm run paint:probe:xvfb

      - name: Upload paint probe screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-paint-probe
          path: paint-probe
          retention-days: 7

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-build
          path: dist
          retention-days: 7

  # Issue #11 regression: on a real Windows desktop session the remote WebUI
  # surface must actually be visible above the footer bar. Runs on its own so a
  # composition failure is reported even when other jobs are red.
  windows-paint:
    name: Windows composition paint
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Composition paint probe (Windows desktop)
        run: npm run paint:probe -- --out paint-probe

      - name: Upload paint probe screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-paint-probe
          path: paint-probe
          retention-days: 7

  windows-package:
    name: Windows x64 packages (Portable + Setup)
    runs-on: windows-latest
    timeout-minutes: 45
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify again on Windows
        run: |
          npm run typecheck
          npm run lint
          npm test

      # Issue #14: one build produces both packages from the same sources.
      - name: Package portable EXE and NSIS Setup EXE
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Record artifact names, sizes and hashes
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $portableName = "DSH-WSL-$version-x64-Portable.exe"
          $setupName = "DSH-WSL-$version-x64-Setup.exe"
          $portable = Join-Path 'release' $portableName
          $setup = Join-Path 'release' $setupName
          foreach ($file in @($portable, $setup)) {
            if (-not (Test-Path $file)) { throw "expected artifact is missing: $file" }
            $size = (Get-Item $file).Length
            if ($size -lt 50MB) { throw "artifact is smaller than expected: $file ($size bytes)" }
          }
          # Exactly two top-level EXEs: no stale or ambiguous leftovers.
          $exes = @(Get-ChildItem release -Filter '*.exe' -File)
          if ($exes.Count -ne 2) { throw "expected exactly 2 top-level EXEs, found $($exes.Count): $($exes.Name -join ', ')" }
          $unexpected = @($exes | Where-Object { $_.Name -ne $portableName -and $_.Name -ne $setupName })
          if ($unexpected.Count -ne 0) { throw "unexpected artifact names: $($unexpected.Name -join ', ')" }
          $portableHash = (Get-FileHash $portable -Algorithm SHA256).Hash.ToLower()
          $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "version=$version" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "portable=$portableName size=$((Get-Item $portable).Length) sha256=$portableHash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "setup=$setupName size=$((Get-Item $setup).Length) sha256=$setupHash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "$portableHash  $portableName" | Out-File -FilePath release/SHA256SUMS.txt -Encoding ascii
          "$setupHash  $setupName" | Out-File -FilePath release/SHA256SUMS.txt -Append -Encoding ascii
          Get-Content release/SHA256SUMS.txt

      # Issue #14: the rename must not move the profile. A pre-existing
      # %APPDATA%\wsl-web-shell (config, logs) has to stay the live one for both
      # packages, and the new display name must not create a second profile.
      - name: Profile continuity - legacy profile survives the rename
        shell: pwsh
        run: |
          $legacy = Join-Path $env:APPDATA 'wsl-web-shell'
          $renamed = Join-Path $env:APPDATA 'DSH WSL'
          if (Test-Path $renamed) { Remove-Item -Recurse -Force $renamed }
          New-Item -ItemType Directory -Force -Path (Join-Path $legacy 'logs') | Out-Null
          '{"port":3091,"presetId":"deepseek-harness"}' | Out-File (Join-Path $legacy 'config.json') -Encoding ascii
          'legacy profile marker' | Out-File (Join-Path $legacy 'logs\app.log') -Encoding ascii
          $configBefore = (Get-FileHash (Join-Path $legacy 'config.json') -Algorithm SHA256).Hash
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $portable = Resolve-Path (Join-Path 'release' "DSH-WSL-$version-x64-Portable.exe")
          $probe = Join-Path $env:RUNNER_TEMP 'profile-portable.json'
          Start-Process -FilePath $portable -ArgumentList "--profile-probe=$probe" -Wait
          $info = Get-Content $probe -Raw | ConvertFrom-Json
          Write-Host "portable: name=$($info.name) userData=$($info.userData)"
          if ($info.name -ne 'DSH WSL') { throw "the portable build still calls itself $($info.name)" }
          if ($info.userData -ne $legacy) { throw "the portable build uses $($info.userData) instead of $legacy" }
          if ((Get-FileHash (Join-Path $legacy 'config.json') -Algorithm SHA256).Hash -ne $configBefore) {
            throw 'the existing config.json was modified by the rename'
          }
          if (-not (Test-Path (Join-Path $legacy 'logs\app.log'))) { throw 'the existing log file disappeared' }
          if (Test-Path $renamed) { throw "a second profile was created at $renamed" }
          'portable build keeps the legacy profile' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # Issue #14: the assisted installer must install per-user without elevation,
      # create shortcuts and an uninstall entry, and keep user data outside the
      # installation directory.
      - name: Setup EXE install smoke (silent, per-user)
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = Join-Path 'release' "DSH-WSL-$version-x64-Setup.exe"
          $target = Join-Path $env:RUNNER_TEMP 'dsh-wsl-installed'
          if (Test-Path $target) { Remove-Item -Recurse -Force $target }
          $app = Join-Path $target 'DSH WSL.exe'
          # Do not block on -Wait: with runAfterFinish the installer may start the
          # app itself, and the app would keep running. Wait for the files instead.
          $install = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$target" -PassThru
          $deadline = (Get-Date).AddSeconds(180)
          while ((Get-Date) -lt $deadline) {
            $uninstallerNow = @(Get-ChildItem $target -Filter 'Uninstall *.exe' -File -ErrorAction SilentlyContinue)
            if ((Test-Path $app) -and ($uninstallerNow.Count -eq 1) -and $install.HasExited) { break }
            Start-Sleep -Milliseconds 500
          }
          $install.Refresh()
          if (-not $install.HasExited) { $install.WaitForExit(60000) | Out-Null }
          if (-not (Test-Path $app)) { throw "installer did not produce $app (exit $($install.ExitCode))" }
          # A launched instance must not hold the probe or the uninstaller.
          Get-Process -Name 'DSH WSL' -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "stopping the instance the installer started (pid $($_.Id))"
            Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep -Milliseconds 500
          foreach ($file in @($app, (Join-Path $target 'resources\app.asar'))) {
            if (-not (Test-Path $file)) { throw "installed file is missing: $file" }
          }
          $uninstallerName = "Uninstall DSH WSL.exe"
          if (-not (Test-Path (Join-Path $target $uninstallerName))) { throw "expected uninstaller $uninstallerName" }
          $startMenu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          $shortcuts = @(Get-ChildItem $startMenu -Recurse -Filter '*.lnk' -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '*DSH WSL*' })
          if ($shortcuts.Count -lt 1) { throw 'Start menu shortcut was not created' }
          $entries = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
            ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -like '*DSH WSL*' })
          if ($entries.Count -lt 1) { throw 'Installed Apps entry was not registered' }
          "installed=$target" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "shortcut=$($shortcuts[0].FullName)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "uninstallEntry=$($entries[0].DisplayName)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Profile continuity - installed build uses the same profile
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'dsh-wsl-installed'
          $app = Join-Path $target 'DSH WSL.exe'
          $legacy = Join-Path $env:APPDATA 'wsl-web-shell'
          $renamed = Join-Path $env:APPDATA 'DSH WSL'
          $probe = Join-Path $env:RUNNER_TEMP 'profile-installed.json'
          Start-Process -FilePath $app -ArgumentList "--profile-probe=$probe" -Wait
          $info = Get-Content $probe -Raw | ConvertFrom-Json
          Write-Host "installed: name=$($info.name) userData=$($info.userData) packaged=$($info.packaged)"
          if ($info.name -ne 'DSH WSL') { throw "the installed build still calls itself $($info.name)" }
          if ($info.userData -ne $legacy) { throw "the installed build uses $($info.userData) instead of $legacy" }
          if (Test-Path $renamed) { throw "the installed build created a second profile at $renamed" }
          if (-not (Test-Path (Join-Path $legacy 'logs\app.log'))) { throw 'the existing profile was replaced by the installed build' }
          'installed build keeps the legacy profile' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Setup EXE uninstall smoke
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'dsh-wsl-installed'
          $uninstaller = Join-Path $target 'Uninstall DSH WSL.exe'
          if (-not (Test-Path $uninstaller)) { throw "uninstaller is missing: $uninstaller" }
          # A normal silent uninstall (no `_?=`): the uninstaller copies itself to
          # a temporary directory first, otherwise it cannot delete the directory it
          # is running from. Then wait for the installation to disappear.
          $removal = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($removal.ExitCode -ne 0) { throw "uninstaller exited with $($removal.ExitCode)" }
          $deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path $target) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          Get-Process -Name 'Uninstall DSH WSL', 'Au_' -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "stopping the leftover uninstaller process (pid $($_.Id))"
            Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue
          }
          foreach ($file in @((Join-Path $target 'DSH WSL.exe'), (Join-Path $target 'resources\app.asar'))) {
            if (Test-Path $file) { throw "installed file survived the uninstall: $file" }
          }
          if (Test-Path $target) {
            $leftover = @(Get-ChildItem $target -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
            Write-Host "leftover in the installation directory: $($leftover -join '; ')"
            throw 'installation directory survived the uninstall'
          }
          $startMenu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          $shortcuts = @(Get-ChildItem $startMenu -Recurse -Filter '*.lnk' -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '*DSH WSL*' })
          if ($shortcuts.Count -ne 0) { throw "Start menu shortcut survived the uninstall: $($shortcuts.FullName -join ', ')" }
          $entries = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
            ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -like '*DSH WSL*' })
          if ($entries.Count -ne 0) { throw 'Installed Apps entry survived the uninstall' }
          $legacy = Join-Path $env:APPDATA 'wsl-web-shell'
          foreach ($file in @((Join-Path $legacy 'config.json'), (Join-Path $legacy 'logs\app.log'))) {
            if (-not (Test-Path $file)) { throw "the uninstaller deleted user data: $file" }
          }
          'uninstall removed the installation, its shortcuts and its uninstall entry; the legacy profile and its data were preserved' |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: dsh-wsl-windows-x64
          path: |
            release/DSH-WSL-*-x64-Portable.exe
            release/DSH-WSL-*-x64-Setup.exe
            release/SHA256SUMS.txt
          retention-days: 7
