appId: com.triagmas.wslwebshell
productName: DSH WSL
copyright: Copyright (c) 2026 triagmas

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - '!**/*.map'
  # Development-only harness bundle (scripts/build-composition.mjs).
  - '!dist/test/**'

asar: true
compression: maximum
electronLanguages:
  - en-US

win:
  # Issue #14: one Windows x64 build produces both packages from the same sources.
  #   portable -> DSH-WSL-<version>-x64-Portable.exe (no installation)
  #   nsis     -> DSH-WSL-<version>-x64-Setup.exe    (assisted installer)
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
  icon: build/icon.png

portable:
  artifactName: DSH-WSL-${version}-x64-Portable.${ext}

nsis:
  artifactName: DSH-WSL-${version}-x64-Setup.${ext}
  # Assisted (not one-click) wizard: install path and shortcuts are user choices.
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DSH WSL
  uninstallDisplayName: DSH WSL ${version}
  # The uninstaller must never delete the WSL runtime, DSH data or the app profile:
  # they live outside the installation directory and stay untouched.
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  differentialPackage: false
  installerLanguages:
    - en_US
  language: '1033'
